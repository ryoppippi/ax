name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A push to a branch with an open PR would otherwise run this twice.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: nix/bun.nix must be in sync with bun.lock
        run: git diff --exit-code nix/bun.nix
      - name: src/agent-context.gen.ts must be in sync with agent-context.txt
        run: bun run gen && git diff --exit-code src/agent-context.gen.ts
      - run: bunx tsc --noEmit
      - run: bunx oxfmt --check .
      - run: bun test

  # The native build is a separate job per OS: --dynamic binaries are
  # host-native (the embedded engine archive is built per target, and
  # cross-compiling a --dynamic build is not supported), so each platform needs
  # its own runner. The first build on a runner compiles that engine from
  # source, which takes minutes and needs a C toolchain the `test` job has no
  # other use for.
  build:
    name: compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # Windows is expected to fail today: scriptc has not ported the socket
    # stack (net/http/https/tls), which is where ax's fetch lives. Kept in the
    # matrix so the gap stays visible and flips to green on its own once that
    # lands upstream — drop continue-on-error then.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-13, windows-latest]
    defaults:
      run:
        # One script for every OS; Windows runners ship Git Bash.
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      # scriptc's compiler runs on Node, not Bun: typescript@7's synchronous RPC
      # channel reads `stdout._handle.fd` off a spawned child.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile

      - name: Install the C toolchain scriptc drives (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake

      - name: Install the C toolchain scriptc drives (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake

      - name: Install the C toolchain scriptc drives (Windows)
        if: runner.os == 'Windows'
        run: choco install --no-progress -y llvm cmake

      - run: bun run build

      - name: Smoke test — output must match the bun entry point
        run: bash .github/scripts/smoke.sh

      - name: Report binary size
        run: ls -l ax | awk '{print $5, $9}'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ax-${{ matrix.os }}
          path: ax*
          if-no-files-found: error
