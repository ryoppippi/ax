name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # One runner per target: ax needs scriptc's --dynamic (linkedom and fetch run
  # in the embedded JavaScript engine), and a --dynamic build is host-native —
  # the engine archive is built per target and cross-compiling one is not
  # supported. That rules out the old single-runner --target sweep.
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # Windows is best-effort: scriptc has not ported the socket stack
    # (net/http/https/tls), which is where ax's fetch lives. The release
    # publishes whatever the matrix produced, so a Windows failure costs that
    # one asset rather than the whole release.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: darwin-arm64 }
          - { os: macos-13, target: darwin-x64 }
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: windows-latest, target: windows-x64, ext: .exe }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      # scriptc's compiler runs on Node, not Bun.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile

      - name: Install the C toolchain scriptc drives (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake

      - name: Install the C toolchain scriptc drives (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake

      - name: Install the C toolchain scriptc drives (Windows)
        if: runner.os == 'Windows'
        run: choco install --no-progress -y llvm cmake

      - run: bun run build "ax-${{ matrix.target }}${{ matrix.ext }}"

      # Never publish a binary that has not answered correctly on its own
      # platform.
      - name: Smoke test
        env:
          AX: ./ax-${{ matrix.target }}${{ matrix.ext }}
        run: bash .github/scripts/smoke.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ax-${{ matrix.target }}
          path: ax-${{ matrix.target }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    needs: build
    # `build` tolerates a Windows failure, so this must not be gated on every
    # matrix leg succeeding.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Tag must match the version in package.json
        run: |
          v=$(jq -r .version package.json)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "package.json version is $v but tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect binaries
        run: |
          mkdir -p dist
          find artifacts -type f -name 'ax-*' -exec mv {} dist/ \;
          chmod +x dist/ax-*
          ls -lh dist/
          # Every platform the installer and the Homebrew formula resolve to has
          # to be present; Windows is allowed to be missing (see `build`).
          missing=
          for t in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            [ -f "dist/ax-$t" ] || missing="$missing ax-$t"
          done
          if [ -n "$missing" ]; then
            echo "missing required release assets:$missing" >&2
            exit 1
          fi
          [ -f dist/ax-windows-x64.exe ] || echo "note: no Windows asset in this release" >&2

      - name: Generate checksums
        run: |
          cd dist
          shasum -a 256 ax-* > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update Homebrew tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then echo "TAP_DEPLOY_KEY not set, skipping"; exit 0; fi
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:yusukebe/homebrew-tap.git tap
          sh scripts/formula.sh "${GITHUB_REF_NAME#v}" dist/checksums.txt > tap/Formula/ax.rb
          cd tap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/ax.rb
          git commit -m "ax ${GITHUB_REF_NAME#v}"
          git push
